/* ================= CORE FINANCE LOGIC (pure, state-in / state-out) ================= */
const inRange=(t,a,b)=>t.date>=a&&t.date<=b;
function periodStats(s,a,b){let inc=0,exp=0,n=0;const cats={},src={};
 s.tx.forEach(t=>{if(!inRange(t,a,b))return;n++;if(t.type==='income'){inc+=t.amount;src[t.cat]=r2((src[t.cat]||0)+t.amount)}else{exp+=t.amount;cats[t.cat]=r2((cats[t.cat]||0)+t.amount)}});
 inc=r2(inc);exp=r2(exp);return{inc,exp,net:r2(inc-exp),rate:inc>0?(inc-exp)/inc:null,cats,src,n}}
const monthStats=(s,m)=>periodStats(s,...monthRange(m));
const contribTotal=c=>r2(c.contributions.reduce((a,x)=>a+x.amount,0));
const reserved=s=>r2(s.challenges.filter(c=>c.status==='active').reduce((a,c)=>a+contribTotal(c),0));
const balance=s=>{let b=s.opening;s.tx.forEach(t=>{b+=t.type==='income'?t.amount:-t.amount});return r2(b-reserved(s))};
function addTx(s,d){const e=validateTx(d);if(e)return{ok:false,error:e};const t=cleanTx({...d,id:null});s.tx.push(t);return{ok:true,tx:t}}
function updateTx(s,id,d){const i=s.tx.findIndex(t=>t.id===id);if(i<0)return{ok:false,error:'Transaction not found.'};const e=validateTx(d);if(e)return{ok:false,error:e};s.tx[i]=cleanTx({...d,id,demo:s.tx[i].demo});return{ok:true}}
function deleteTx(s,id){const n=s.tx.length;s.tx=s.tx.filter(t=>t.id!==id);return{ok:s.tx.length<n}}
function filterTx(s,f={}){let l=s.tx.filter(t=>(!f.type||t.type===f.type)&&(!f.cat||t.cat===f.cat)&&(!f.from||t.date>=f.from)&&(!f.to||t.date<=f.to)&&(!f.q||t.desc.toLowerCase().includes(f.q.toLowerCase())));
 const so={new:(a,b)=>b.date.localeCompare(a.date),old:(a,b)=>a.date.localeCompare(b.date),high:(a,b)=>b.amount-a.amount,low:(a,b)=>a.amount-b.amount}[f.sort||'new'];return l.sort(so)}
/* budgets */
const budgetRange=(b,m)=>b.period==='custom'?[b.from,b.to]:monthRange(m);
const effLimit=(s,b,m)=>(b.cat==='ALL'&&b.period==='monthly'&&s.monthBudgets&&s.monthBudgets[m])||b.limit;
function budgetUse(s,b,m){const[a,z]=budgetRange(b,m),lim=effLimit(s,b,m);let sp=0;s.tx.forEach(t=>{if(t.type==='expense'&&inRange(t,a,z)&&(b.cat==='ALL'||t.cat===b.cat))sp+=t.amount});sp=r2(sp);return{spent:sp,left:r2(lim-sp),pct:sp/lim*100,range:[a,z],limit:lim}}
function saveBudget(s,d,id){const lim=Number(d.limit);if(!Number.isFinite(lim)||lim<=0)return{ok:false,error:'Enter a budget limit greater than 0.'};
 if(d.cat!=='ALL'&&!EXP.includes(d.cat))return{ok:false,error:'Choose a valid category.'};if(!['monthly','custom'].includes(d.period))return{ok:false,error:'Choose a budget period.'};
 if(d.period==='custom'&&(!validDate(d.from)||!validDate(d.to)||d.from>d.to))return{ok:false,error:'Custom period needs valid start and end dates (start ≤ end).'};
 if(d.period==='monthly'&&s.budgets.some(b=>b.id!==id&&b.period==='monthly'&&b.cat===d.cat))return{ok:false,error:'A monthly budget for this category already exists. Edit it instead.'};
 const b={id:id||uid(),cat:d.cat,limit:r2(lim),period:d.period,from:d.period==='custom'?d.from:'',to:d.period==='custom'?d.to:''};
 const i=s.budgets.findIndex(x=>x.id===id);if(i>=0)s.budgets[i]=b;else s.budgets.push(b);return{ok:true}}
const barTone=p=>p>=100?'var(--r)':p>=90?'var(--o)':p>=75?'#eab308':'var(--g)';
/* notifications */
function pushNotif(s,msg,type,key){if(key&&s.notifs.some(n=>n.key===key))return false;s.notifs.push({id:uid(),msg,type,ts:Date.now(),read:false,key:key||''});if(s.notifs.length>200)s.notifs.shift();return true}
const budgetsForAlerts=(s,T)=>{const l=[...s.budgets],m=mOf(T);if(s.monthBudgets&&s.monthBudgets[m]&&!l.some(b=>b.cat==='ALL'&&b.period==='monthly'))l.push({id:'mb-'+m,cat:'ALL',period:'monthly',limit:s.monthBudgets[m],from:'',to:''});return l};
function checkBudgetAlerts(s){const T=today(),added=[];
 budgetsForAlerts(s,T).forEach(b=>{const[a,z]=budgetRange(b,mOf(T));if(T<a||T>z)return;const u=budgetUse(s,b,mOf(T)),top=[100,90,75].find(x=>u.pct>=x);if(!top)return;

  const nm=b.cat==='ALL'?'Total':b.cat;const msg=top===100?`${nm} budget exceeded: ${fmt(u.spent)} spent of ${fmt(u.limit)} (over by ${fmt(u.spent-u.limit)}).`:`${nm} budget is ${Math.floor(u.pct)}% used: ${fmt(u.spent)} of ${fmt(u.limit)}.`;
  if(pushNotif(s,msg,top===100?'danger':'warn',k(top)))added.push(msg)});return added}
/* piggy bank */
const isLocked=c=>today()<c.unlock;
function createChallenge(s,d){const name=String(d.name||'').trim(),days=Number(d.days),target=Number(d.target),daily=Number(d.daily||0);
 if(!name)return{ok:false,error:'Give the challenge a name.'};if(!Number.isInteger(days)||days<1||days>365)return{ok:false,error:'Duration must be 1 to 365 whole days.'};
 if(!Number.isFinite(target)||target<=0)return{ok:false,error:'Enter a savings target greater than 0.'};if(!Number.isFinite(daily)||daily<0)return{ok:false,error:'Daily amount cannot be negative.'};
 const rule={on:!!d.ruleOn,threshold:Number(d.threshold)||0,amount:Number(d.ruleAmount)||0};
 if(rule.on&&(rule.threshold<=0||rule.amount<=0))return{ok:false,error:'The daily rule needs a spending threshold and an amount, both above 0.'};
 const st=today(),c={id:uid(),name:name.slice(0,60),target:r2(target),daily:r2(daily),days,start:st,unlock:addDays(st,days),hidden:!!d.hidden,rule,status:'active',releasedAt:null,releasedAmount:0,contributions:[]};
 s.challenges.push(c);return{ok:true,challenge:c}}
function contribute(s,id,amount,opt={}){const c=s.challenges.find(x=>x.id===id);if(!c)return{ok:false,error:'Challenge not found.'};if(c.status!=='active')return{ok:false,error:'This challenge is no longer active.'};
 const a=Number(amount);if(!Number.isFinite(a)||a<=0)return{ok:false,error:'Enter an amount greater than 0.'};if(Math.abs(a*100-Math.round(a*100))>1e-6)return{ok:false,error:'Use at most 2 decimal places.'};
 const bal=balance(s);if(a>bal)return{ok:false,error:`Not enough available balance. You have ${fmt(bal)} available.`};
 c.contributions.push({id:uid(),amount:r2(a),date:today(),kind:opt.kind||'manual',forDate:opt.forDate||null});return{ok:true}}
function release(s,id){const c=s.challenges.find(x=>x.id===id);if(!c)return{ok:false,error:'Challenge not found.'};
 if(c.status!=='active')return{ok:false,error:'These savings were already '+(c.status==='released'?'released':'cancelled')+'.'};
 if(isLocked(c))return{ok:false,error:`Locked until ${fdate(c.unlock)}. Savings can be released only after the unlock date.`};
 c.releasedAmount=contribTotal(c);c.status='released';c.releasedAt=today();return{ok:true,amount:c.releasedAmount}}
function cancelChallenge(s,id){const c=s.challenges.find(x=>x.id===id);if(!c||c.status!=='active')return{ok:false,error:'Only active challenges can be cancelled.'};
 c.releasedAmount=contribTotal(c);c.status='cancelled';c.releasedAt=today();return{ok:true,amount:c.releasedAmount}}
function applyRules(s){let added=0,skipped=0;const T=today();
 s.challenges.filter(c=>c.status==='active'&&c.rule.on).forEach(c=>{const last=[addDays(T,-1),addDays(c.unlock,-1)].sort()[0];
  for(let d=c.start;d<=last;d=addDays(d,1)){if(c.contributions.some(x=>x.kind==='rule'&&x.forDate===d))continue;
   let spend=0;s.tx.forEach(t=>{if(t.type==='expense'&&t.date===d)spend+=t.amount});if(spend>=c.rule.threshold)continue;
   const r=contribute(s,c.id,c.rule.amount,{kind:'rule',forDate:d});r.ok?added++:skipped++}});return{added,skipped}}
function genReminders(s){const T=today();s.challenges.filter(c=>c.status==='active').forEach(c=>{
 if(!isLocked(c))pushNotif(s,`"${c.name}" has matured. Open Piggy Bank to release ${c.hidden?'your':fmt(contribTotal(c))} savings.`,'info',`${c.id}|ready`);
 else if(c.daily>0&&!c.contributions.some(x=>x.date===T))pushNotif(s,`Daily reminder: set aside ${fmt(c.daily)} for "${c.name}" (${diffDays(T,c.unlock)} days to unlock).`,'info',`${c.id}|remind|${T}`)})}

const avgMonthlyExpense=s=>{const m={};s.tx.forEach(t=>{if(t.type==='expense')m[mOf(t.date)]=(m[mOf(t.date)]||0)+t.amount});const v=Object.values(m);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
function health(s,m){const st=monthStats(s,m);if(!st.inc&&!st.exp)return{score:null,parts:[],note:'Add income and expenses for this month to calculate a score.'};const parts=[];
 const p1=st.rate===null?0:Math.max(0,Math.min(40,st.rate/.2*40));parts.push({label:'Savings rate',pts:p1,max:40,why:st.rate===null?'No income recorded this month.':`You kept ${(st.rate*100).toFixed(0)}% of income (20% or more earns full points).`});
 const bs=s.budgets.map(b=>budgetUse(s,b,m));
 parts.push(bs.length?{label:'Budget discipline',pts:30*bs.filter(u=>u.pct<=100).length/bs.length,max:30,why:`${bs.filter(u=>u.pct<=100).length} of ${bs.length} budgets are within their limit.`}:{label:'Budget discipline',pts:15,max:30,why:'No budgets set, so half points. Create one to improve this.'});
 const av=avgMonthlyExpense(s);if(av>0){const mo=(balance(s)+reserved(s))/av;parts.push({label:'Safety buffer',pts:Math.max(0,Math.min(30,mo/3*30)),max:30,why:`Your funds cover ${Math.max(0,mo).toFixed(1)} months of average spending (3 or more earns full points).`})}else parts.push({label:'Safety buffer',pts:0,max:30,why:'No expense history yet.'});
 const score=Math.round(parts.reduce((a,p)=>a+p.pts,0));parts.forEach(p=>p.pts=Math.round(p.pts));return{score,parts,label:score>=80?'Excellent':score>=60?'Good':score>=40?'Fair':'Needs attention'}}
const InsightProvider={name:'Local rules engine',generate(s,m){

 const pm=shiftMonth(m,-1),ps=monthStats(s,pm);
 if(ps.exp>0){const ch=(st.exp-ps.exp)/ps.exp*100;const diffs=EXP.map(c=>[c,(st.cats[c]||0)-(ps.cats[c]||0)]).filter(x=>x[1]!==0).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  cards.push({tone:ch>10?'o':'g',title:'Change vs previous month',text:`Spending is ${ch>=0?'up':'down'} ${Math.abs(ch).toFixed(0)}% (${fmt(st.exp)} vs ${fmt(ps.exp)} in ${mLabel(pm)}).`+(diffs[0]?` Biggest shift: ${diffs[0][0]} ${diffs[0][1]>0?'+':'−'}${fmt(Math.abs(diffs[0][1]))}.`:'')})}

 const un=[];s.tx.filter(t=>t.type==='expense'&&mOf(t.date)===m).forEach(t=>{const h=s.tx.filter(x=>x.type==='expense'&&x.cat===t.cat&&x.date<t.date).map(x=>x.amount);if(h.length<5)return;const mean=h.reduce((a,b)=>a+b,0)/h.length,sd=Math.sqrt(h.reduce((a,b)=>a+(b-mean)**2,0)/h.length);if(t.amount>mean+2*sd&&t.amount>=1.5*mean)un.push(`${t.desc} (${fmt(t.amount)} on ${fdate(t.date)}) is far above your usual ${t.cat} spend of about ${fmt(mean)}.`)});

/* ================= CSV ================= */
const txKey=t=>[t.date,t.type,Number(t.amount).toFixed(2),String(t.desc).trim().toLowerCase()].join('|');
function parseCSV(t){const rows=[];let row=[],f='',q=false;t=String(t).replace(/^\uFEFF/,'');
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else f+=c}
 row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
const REQ=['date','type','category','description','amount','method'];
function validateImport(text,s){const rows=parseCSV(text);if(rows.length<2)return{error:'The file is empty or has no data rows.'};
 const h=rows[0].map(x=>x.trim().toLowerCase()),miss=REQ.filter(c=>!h.includes(c));if(miss.length)return{error:'Missing column(s): '+miss.join(', ')+'. Expected: date,type,category,description,amount,method,notes'};
 if(rows.length>5001)return{error:'Too many rows (max 5000).'};
 const seen=new Set(s.tx.map(txKey)),out=[];
 rows.slice(1).forEach((r,i)=>{const g=n=>h.indexOf(n)>=0?String(r[h.indexOf(n)]??'').trim():'';const type=g('type').toLowerCase(),L=type==='income'?INC:EXP;
  const d={type,date:g('date'),cat:L.find(x=>x.toLowerCase()===fixCat(g('category')).toLowerCase())||fixCat(g('category')),desc:g('description'),amount:g('amount')===''?NaN:Number(g('amount')),method:METH.find(x=>x.toLowerCase()===g('method').toLowerCase())||g('method'),notes:g('notes')};
  const err=validateTx(d);let dup=false;if(!err){const k=txKey(d);if(seen.has(k))dup=true;else seen.add(k)}out.push({line:i+2,d,err,dup})});
 return{rows:out,ok:out.filter(x=>!x.err&&!x.dup).length,bad:out.filter(x=>x.err).length,dup:out.filter(x=>x.dup).length}}
const safeCell=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=l=>'date,type,category,description,amount,method,notes\n'+l.map(t=>[t.date,t.type,t.cat,t.desc,t.amount,t.method,t.notes].map(safeCell).join(',')).join('\n');
const dl=(name,text,type='text/csv')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove()};

function barChart(ser,ca='#22c55e',cb='#fb923c',single=false){
 if(!ser.length||ser.every(x=>!x.a&&!x.b))return'<div class="empty">No data for this period yet.</div>';
 const W=560,H=220,P={l:46,r:8,t:10,b:26},mx=Math.max(1,...ser.flatMap(x=>single?[x.a]:[x.a,x.b])),bw=(W-P.l-P.r)/ser.length,ch=H-P.t-P.b;let g='';
 for(let i=0;i<=4;i++){const y=P.t+ch*i/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mute)">${short(mx*(1-i/4))}</text>`}
 ser.forEach((x,i)=>{const x0=P.l+i*bw,w=single?bw*.5:bw*.3,h=v=>Math.max(0,ch*v/mx);
  if(single)g+=`<rect x="${x0+bw*.25}" y="${P.t+ch-h(x.a)}" width="${w}" height="${h(x.a)}" rx="5" fill="${ca}"><title>${esc(x.l)}: ${fmt(x.a)}</title></rect>`;
  else g+=`<rect x="${x0+bw*.18}" y="${P.t+ch-h(x.a)}" width="${w}" height="${h(x.a)}" rx="5" fill="${ca}"><title>${esc(x.l)} income: ${fmt(x.a)}</title></rect><rect x="${x0+bw*.52}" y="${P.t+ch-h(x.b)}" width="${w}" height="${h(x.b)}" rx="5" fill="${cb}"><title>${esc(x.l)} expenses: ${fmt(x.b)}</title></rect>`;
  g+=`<text x="${x0+bw/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="var(--mute)">${esc(x.l)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bar chart">${g}</svg>`}
function donut(data){const tot=data.reduce((a,d)=>a+d.value,0);if(!tot)return'<div class="empty">No expenses in this period.</div>';let off=0;const R=60,C=2*Math.PI*R;
 const arcs=data.map((d,i)=>{const len=d.value/tot*C,s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(d.label)}: ${fmt(d.value)}</title></circle>`;off+=len;return s}).join('');
 return `<div class="fl" style="flex-wrap:nowrap"><svg viewBox="0 0 160 160" width="150" class="fix" role="img" aria-label="Category chart">${arcs}<text x="80" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${short(tot)}</text></svg><div style="min-width:0">${data.slice(0,6).map((d,i)=>`<div class="mute" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:${PAL[i%PAL.length]}">●</span> ${esc(d.label)} <b style="color:var(--ink)">${(d.value/tot*100).toFixed(0)}%</b></div>`).join('')}</div></div>`}
function lineChart(pts){if(!pts.length||pts.every(p=>!p.y))return'<div class="empty">No spending in this period.</div>';const W=560,H=200,P={l:46,r:10,t:10,b:24},mx=Math.max(1,...pts.map(p=>p.y)),X=i=>P.l+i*(W-P.l-P.r)/Math.max(1,pts.length-1),Y=v=>P.t+(H-P.t-P.b)*(1-v/mx);
 const ln=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Spending trend"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="${P.l}" x2="${W-P.r}" y1="${P.t+(H-P.t-P.b)*i/3}" y2="${P.t+(H-P.t-P.b)*i/3}" stroke="var(--line)"/><text x="${P.l-6}" y="${P.t+(H-P.t-P.b)*i/3+4}" text-anchor="end" font-size="10" fill="var(--mute)">${short(mx*(1-i/3))}</text>`).join('')}<path d="${ln} L${X(pts.length-1)} ${H-P.b} L${X(0)} ${H-P.b}Z" fill="url(#lg)"/><path d="${ln}" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>${[0,Math.floor((pts.length-1)/2),pts.length-1].map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--mute)">${esc(pts[i].x)}</text>`).join('')}</svg>`}
const ring=(pct,col,label,sub,size=130)=>{const R=52,C=2*Math.PI*R,p=Math.max(0,Math.min(1,pct));return `<div class="ring"><svg width="${size}" height="${size}" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 60 60)"/></svg><div class="c"><div><div class="mid">${label}</div><div class="mute" style="font-size:11px">${sub}</div></div></div></div>`};

/* ================= MONTHLY BUDGET MONITOR (overload detection + breakdown) ================= */
ui.bm={cat:'',sort:'big'};
const fullMonth=m=>new Date(m+'-01T00:00:00').toLocaleString('en-IN',{month:'long',year:'numeric'});
function monthLimit(s,m){const o=s.monthBudgets&&s.monthBudgets[m];if(o>0)return{limit:o,source:'month'};const b=s.budgets.find(x=>x.cat==='ALL'&&x.period==='monthly');return b?{limit:b.limit,source:'default'}:{limit:null,source:'none'}}
function budgetMonitor(s,m){const spent=monthStats(s,m).exp,{limit,source}=monthLimit(s,m);
 if(limit===null)return{m,limit:null,source,spent,left:null,excess:0,pct:null,state:'none'};
 const left=r2(limit-spent);return{m,limit,source,spent,left:left>0?left:0,excess:left<0?r2(-left):0,pct:spent/limit*100,state:left>0?'within':left===0?'full':'over'}}
function breakdown(s,m){const st=monthStats(s,m),tot=st.exp;return Object.entries(st.cats).sort((a,b)=>b[1]-a[1]).map(([cat,amount])=>{const cb=s.budgets.find(b=>b.cat===cat&&b.period==='monthly'),lim=cb?cb.limit:null;
 return{cat,amount,pct:tot?amount/tot*100:0,catLimit:lim,catOver:lim!==null&&amount>lim?r2(amount-lim):0,count:s.tx.filter(t=>t.type==='expense'&&t.cat===cat&&mOf(t.date)===m).length}})}
function monthTx(s,m,o={}){const l=s.tx.map((t,i)=>({t,i})).filter(x=>x.t.type==='expense'&&mOf(x.t.date)===m&&(!o.cat||x.t.cat===o.cat));
 const cmp={big:(a,b)=>b.t.amount-a.t.amount||a.t.date.localeCompare(b.t.date),old:(a,b)=>a.t.date.localeCompare(b.t.date)||a.i-b.i,new:(a,b)=>b.t.date.localeCompare(a.t.date)||b.i-a.i}[o.sort||'big'];return l.sort(cmp).map(x=>x.t)}
function crossingTx(s,m){const{limit}=monthLimit(s,m);if(limit===null)return null;let run=0;for(const t of monthTx(s,m,{sort:'old'})){run=r2(run+t.amount);if(run>limit)return t.id}return null}
function setMonthBudget(s,m,v){const a=Number(v);if(!/^\d{4}-\d{2}$/.test(m))return{ok:false,error:'Invalid month.'};if(v===''||!Number.isFinite(a)||a<=0||a>1e9)return{ok:false,error:'Enter a budget greater than 0.'};
 if(Math.abs(a*100-Math.round(a*100))>1e-6)return{ok:false,error:'Use at most 2 decimal places.'};s.monthBudgets=s.monthBudgets||{};s.monthBudgets[m]=r2(a);return{ok:true}}
function setDefaultBudget(s,v){const ex=s.budgets.find(b=>b.cat==='ALL'&&b.period==='monthly');return saveBudget(s,{cat:'ALL',limit:v,period:'monthly'},ex?ex.id:undefined)}
function admissionNote(s,m){const bm=budgetMonitor(s,m);if(bm.state!=='over')return null;const items=breakdown(s,m).filter(x=>ADM.includes(x.cat));if(!items.length)return null;
 const total=r2(items.reduce((a,x)=>a+x.amount,0));if(!(total>=bm.excess||total/bm.spent>=.5))return null;const rest=r2(bm.spent-total);return{items,total,share:total/bm.spent*100,rest,restWithin:rest<=bm.limit,limit:bm.limit}}
const admissionBanner=(s,m)=>{const a=admissionNote(s,m);return a?`<div class="bm-banner warn" role="status"><span>🎓</span><div><b>High expenses this month due to the admission process.</b> ${a.items.map(x=>`${esc(x.cat)} ${fmt(x.amount)}`).join(' · ')} <span class="mute">(${fmt(a.total)} in total, ${Math.round(a.share)}% of this month’s spending)</span></div></div>`:''};
function monthInsight(s,m){const st=monthStats(s,m),bm=budgetMonitor(s,m),bd=breakdown(s,m),L=[];
 if(!st.exp)return[`No expenses are recorded for ${fullMonth(m)} yet.`+(bm.limit!==null?` Your budget for the month is ${fmt(bm.limit)}.`:'')];
 if(bm.state==='over')L.push(`Your expenses exceeded your monthly budget by ${fmt(bm.excess)}: ${fmt(bm.spent)} spent against a ${fmt(bm.limit)} budget.`);
 else if(bm.state==='full')L.push(`You have used your entire ${fmt(bm.limit)} budget. Nothing is left, and there is no excess.`);
 else if(bm.state==='within')L.push(`You are within budget: ${fmt(bm.spent)} spent of ${fmt(bm.limit)}, with ${fmt(bm.left)} remaining (${Number(bm.pct.toFixed(1))}% used).`);
 else L.push(`You spent ${fmt(st.exp)} in ${fullMonth(m)}. Set a monthly budget to see whether you are overspending.`);
 const adm=admissionNote(s,m);if(adm){L.push(`High expenses this month due to the admission process. Admission-related costs (${adm.items.map(x=>`${x.cat} ${fmt(x.amount)}`).join(', ')}) total ${fmt(adm.total)}, which is ${Math.round(adm.share)}% of your spending.`);L.push(`Without them you would have spent ${fmt(adm.rest)}${adm.restWithin?`, within your ${fmt(adm.limit)} budget`:''}.`)}
 const top=bd[0];L.push(`Your largest expense category was ${top.cat}, accounting for ${fmt(top.amount)} (${Number(top.pct.toFixed(1))}%) of your total spending.`+(bd[1]?` It was followed by ${bd.slice(1,3).map(x=>`${x.cat} (${fmt(x.amount)})`).join(' and ')}.`:''));
 const big=monthTx(s,m,{sort:'big'})[0];L.push(`The single largest expense was “${big.desc}” at ${fmt(big.amount)} on ${fdate(big.date)}.`);
